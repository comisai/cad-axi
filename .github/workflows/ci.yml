name: ci
# The front end checked on Node 22 and 24; the engine built with NativeAOT on
# native x64 and arm64 runners and proved on made-up drawings and ACadSharp's
# samples; every command, the AXI principles, hostile files and the write
# matrix run against that engine on each platform; LibreDWG and ezdxf read
# what the tool writes; the package is packed and installed as npm would.
# LibreDWG and ezdxf run here only; nothing from them ships.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    # bash -eo pipefail, so a failing step is not hidden by `| tee`.
    shell: bash
jobs:
  front:
    name: front (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  engine:
    name: engine (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: engine/global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Native toolchain for NativeAOT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends clang zlib1g-dev
      - name: Restore in locked mode
        working-directory: engine
        run: dotnet restore --locked-mode
      - name: Publish with NativeAOT
        working-directory: engine
        run: dotnet publish -c Release -r ${{ matrix.rid }} --no-restore -o out/${{ matrix.rid }}
      - name: C library floor (Debian trixie has glibc 2.41)
        run: |
          bin=engine/out/${{ matrix.rid }}/cad-axi-engine
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Newest C library symbol: $newest" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(printf '%s\nGLIBC_2.41\n' "$newest" | sort -V | tail -1)" = "GLIBC_2.41"
      - name: Fetch ACadSharp's sample drawings
        run: node scripts/fetch-samples.mjs "$RUNNER_TEMP/samples"
      - name: Engine proof
        run: >-
          node scripts/engine-proof.mjs
          --engine engine/out/${{ matrix.rid }}/cad-axi-engine
          --work "$RUNNER_TEMP/proof"
          --report proof-${{ matrix.rid }}.json
          --samples "$RUNNER_TEMP/samples"
          | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep what later jobs read
        if: always()
        run: |
          mkdir -p keep/written
          cp proof-${{ matrix.rid }}.json keep/ || true
          cp "$RUNNER_TEMP"/proof/out/known-* keep/written/ || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.rid }}
          path: engine/out/${{ matrix.rid }}/cad-axi-engine
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: proof-${{ matrix.rid }}
          path: keep/

  contract:
    name: contract (${{ matrix.rid }})
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-${{ matrix.rid }}
          path: engine/out/${{ matrix.rid }}
      - run: chmod 755 engine/out/${{ matrix.rid }}/cad-axi-engine
      - run: npm ci --ignore-scripts
      - name: Every command, the AXI principles and hostile files, on the source
        run: npm run test:contract
      - name: The write matrix
        run: npm run test:write
      - name: The same on the built package
        run: |
          npm run build
          mkdir -p engine-bin/${{ matrix.rid }}
          cp engine/out/${{ matrix.rid }}/cad-axi-engine engine-bin/${{ matrix.rid }}/
          other=$([ "${{ matrix.rid }}" = linux-x64 ] && echo linux-arm64 || echo linux-x64)
          mkdir -p engine-bin/$other && cp engine/out/${{ matrix.rid }}/cad-axi-engine engine-bin/$other/
          node scripts/assemble-package.mjs engine-bin
          npm run test:dist

  oracles:
    name: independent checks
    needs: engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: libredwg
        with:
          path: ~/libredwg
          key: libredwg-0.14-62ebb73b-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/oracles/build-libredwg.sh') }}
      - name: Build LibreDWG 0.14 from its pinned tarball
        if: steps.libredwg.outputs.cache-hit != 'true'
        run: bash scripts/oracles/build-libredwg.sh "$HOME/libredwg"
      - name: ezdxf 1.4.5
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q ezdxf==1.4.5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-linux-x64
          path: engine/out/linux-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proof-linux-x64
          path: proof
      - name: Fetch ACadSharp's sample drawings
        run: node scripts/fetch-samples.mjs "$RUNNER_TEMP/samples"
      - name: Cross-check the engine
        run: |
          chmod 755 engine/out/linux-x64/cad-axi-engine
          "$RUNNER_TEMP/venv/bin/python" scripts/oracles/make_hebrew_dxf.py "$RUNNER_TEMP/hebrew.dxf"
          node scripts/oracles/cross-check.mjs \
            --engine engine/out/linux-x64/cad-axi-engine \
            --libredwg "$HOME/libredwg/bin" \
            --written proof/written \
            --samples "$RUNNER_TEMP/samples" \
            --hebrew-dxf "$RUNNER_TEMP/hebrew.dxf" \
            --python "$RUNNER_TEMP/venv/bin/python" \
            --work "$RUNNER_TEMP/oracle" \
            --report oracle.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The write matrix, read by LibreDWG and ezdxf
        run: |
          npm ci --ignore-scripts
          node scripts/oracles/write-matrix.mjs \
            --cli src/bin/cad-axi.ts \
            --libredwg "$HOME/libredwg/bin" \
            --python "$RUNNER_TEMP/venv/bin/python" \
            --work "$RUNNER_TEMP/matrix" \
            --report write-matrix.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oracle-report
          path: |
            oracle.json
            write-matrix.json

  package:
    name: package
    needs: engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-linux-x64
          path: engine-bin/linux-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-linux-arm64
          path: engine-bin/linux-arm64
      - name: Build, assemble and check
        run: |
          npm ci --ignore-scripts
          npm run build
          node scripts/assemble-package.mjs engine-bin
          node scripts/check-package.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          npm pack --ignore-scripts
          mv cad-axi-*.tgz cad-axi.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: cad-axi.tgz
          if-no-files-found: error

  install:
    name: install (${{ matrix.rid }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pkg
      - name: Install the tarball in a clean folder and run it
        run: |
          mkdir clean && cd clean
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund ../pkg/cad-axi.tgz
          engine=node_modules/cad-axi/dist/engine/${{ matrix.rid }}/cad-axi-engine
          mode=$(stat -c %a "$engine")
          echo "Installed engine mode: $mode" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$mode" = 755
          npx --no-install cad-axi version | tee -a "$GITHUB_STEP_SUMMARY"
          npx --no-install cad-axi version | grep -q 'platform: ${{ matrix.rid }}'
          test "$(npx --no-install cad-axi --version)" = "$(node -p "require('cad-axi/package.json').version")"
          printf '{"entities":[{"kind":"line","from":[0,0],"to":[1000,0]}]}' > spec.json
          npx --no-install cad-axi create --spec spec.json --out one.dwg
          npx --no-install cad-axi measure one.dwg | tee -a "$GITHUB_STEP_SUMMARY"
          npx --no-install cad-axi measure one.dwg | grep -q '"0",1,1,0,measured'
